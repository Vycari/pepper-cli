name: release

# Publishes to PyPI when a `v*` tag is pushed. Authentication is PyPI trusted publishing
# (GitHub OIDC): no API token or secret exists anywhere in this workflow. The `pypi` GitHub
# environment (with a required reviewer) gates the publish job, and the PyPI project must list
# this repository, this workflow file and that environment as a trusted publisher.
#
# Build and publish are separate jobs so the job holding `id-token: write` runs no repo code:
# it only downloads the built distributions and uploads them.

on:
  push:
    tags:
      - "v*"

# Least-privilege default; the publish job widens its own permissions below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # No cache: a release job that publishes must not restore a cache an
          # unprivileged run could have written.
          enable-cache: false
          python-version: "3.13"

      # The tag is data, not code: pass it through the environment rather than expanding it
      # into the script.
      - name: Verify the tag matches the pyproject.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag!r} does not match pyproject.toml version {version!r}")
          print(f"tag {tag} matches version {version}")
          PY

      - name: Build sdist and wheel
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # trusted publishing (OIDC); this job only
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release-github:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
